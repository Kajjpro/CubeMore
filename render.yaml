# Render "Blueprint": tells Render how to run Cube Racing. See DEPLOY.md.
#
# One free web service: the Node server, which also serves the website.
# It is built from the Dockerfile in this folder.
#
# Free plan: it sleeps after ~15 minutes without visitors (the next visit waits
# about a minute while it wakes up) and rooms are kept in memory, so they are
# gone after it sleeps or restarts (unless DATABASE_URL is set).

services:
  - type: web
    name: cubits
    runtime: docker
    plan: free
    # Closest Render region to Mongolia / East Asia.
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render calls this to know the server is up.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Optional: a Postgres database, e.g. Neon (see DEPLOY.md). Keeps rooms across
      # restarts, the match history and the daily leaderboard.
      - key: DATABASE_URL
        sync: false
      # Optional: accounts (sign in with Google, or email and password) through
      # Clerk. See "Accounts" in DEPLOY.md. Without them everyone is a guest.
      # The site's public address, e.g. https://cubemore.com (link previews, sitemap).
      - key: VITE_SITE_URL
        sync: false
      # Optional: Cloudflare Web Analytics token (countries, devices, where visitors come from).
      - key: VITE_CF_ANALYTICS_TOKEN
        sync: false
      # Optional: the analyzer's AI coach (Google AI Studio key).
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      # Your Clerk user id: lets you read the contact messages on /admin.
      - key: ADMIN_USER_IDS
        sync: false
      # Render tells the app which port to use through PORT (the server reads it).
